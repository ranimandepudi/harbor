name: Publish Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish images/manifests as this tag (default: ref tag)"
        required: false
        type: string
      assets_tag:
        description: "Tag of the release that already contains the installer assets"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Select tags
        run: |
          PUBLISH_TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          ASSETS_TAG="${{ github.event.inputs.assets_tag }}"
          PUBLISH_TAG="$(echo -n "$PUBLISH_TAG" | xargs)"
          ASSETS_TAG="$(echo -n "$ASSETS_TAG" | xargs)"
          echo "CUR_TAG=$PUBLISH_TAG"  >> $GITHUB_ENV
          echo "ASSETS_TAG=$ASSETS_TAG" >> $GITHUB_ENV

      - name: Prepare Assets (amd64 + arm64) — from GitHub Release
        env:
          REPO: ${{ github.repository }}
          ASSETS_TAG: ${{ env.ASSETS_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets_path="$PWD/assets"
          mkdir -p "$assets_path"

          rel_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/tags/${ASSETS_TAG}")"

          list_assets() { echo "$rel_json" | jq -r '(.assets // [])[].name'; }

          need=(
            "harbor-offline-installer-${ASSETS_TAG}-amd64.tgz"
            "harbor-offline-installer-${ASSETS_TAG}-arm64.tgz"
            "harbor-online-installer-${ASSETS_TAG}-amd64.tgz"
            "harbor-online-installer-${ASSETS_TAG}-arm64.tgz"
          )
          optional=(
            "harbor-offline-installer-${ASSETS_TAG}-amd64.tgz.sha256"
            "harbor-offline-installer-${ASSETS_TAG}-arm64.tgz.sha256"
            "harbor-online-installer-${ASSETS_TAG}-amd64.tgz.sha256"
            "harbor-online-installer-${ASSETS_TAG}-arm64.tgz.sha256"
          )

          have="$(list_assets)"

          dl_api() {
            local name="$1"
            local url
            url="$(echo "$rel_json" | jq -r --arg n "$name" '.assets[]? | select(.name==$n) | .browser_download_url')"
            if [ -n "${url:-}" ] && [ "$url" != "null" ]; then
              echo "↓ $name"
              curl -fsSL "$url" -o "${assets_path}/${name}"
              return 0
            fi
            return 1
          }

          for f in "${need[@]}"; do
            echo "$have" | grep -qx "$f" || { echo "Missing required asset in release '$ASSETS_TAG': $f"; exit 1; }
            dl_api "$f" || { echo "Failed to download required asset: $f"; exit 1; }
          done
          for f in "${optional[@]}"; do
            if echo "$have" | grep -qx "$f"; then
              dl_api "$f" || echo "Warn: checksum present but failed to download: $f"
            else
              echo "Note: checksum not present (ok): $f"
            fi
          done

          (cd "${assets_path}" && md5sum *.tgz | tee md5sum)

          echo "ASSETS_DIR=${assets_path}" >> $GITHUB_ENV
          echo "OFFLINE_PACKAGE_PATH=${assets_path}/harbor-offline-installer-${ASSETS_TAG}-amd64.tgz" >> $GITHUB_ENV
          echo "ONLINE_PACKAGE_PATH=${assets_path}/harbor-online-installer-${ASSETS_TAG}-amd64.tgz"   >> $GITHUB_ENV
          echo "MD5SUM_PATH=${assets_path}/md5sum" >> $GITHUB_ENV

      - name: Setup Docker
        uses: docker-practice/actions-setup-docker@master
        with:
          docker_version: 20.10
          docker_channel: stable

      - name: Publish Images (amd64 + arm64)
        env:
          CUR_TAG: ${{ env.CUR_TAG }}
          ASSETS_TAG: ${{ env.ASSETS_TAG }}
        run: |
          set -euo pipefail
          docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" -p "${{ secrets.DOCKER_HUB_PASSWORD }}"
          : > "$GITHUB_WORKSPACE/_repos.txt"

          for arch in amd64 arm64; do
            pkg="$PWD/assets/harbor-offline-installer-${ASSETS_TAG}-${arch}.tgz"
            echo "Processing $pkg"
            tar -zxf "$pkg"

            inner_tar="$(ls -1 harbor/harbor*.tar.gz | head -n1)"
            docker load -i "$inner_tar"

            mapfile -t imgs < <(docker images --format "{{.Repository}}:{{.Tag}}" \
              | grep "^ranichowdary/.\\+:" || true)

            # Retag every loaded image as :${CUR_TAG}-${arch}, and push
            for it in "${imgs[@]}"; do
              repo="${it%:*}"
              docker tag "${it}" "${repo}:${CUR_TAG}-${arch}"
              docker push "${repo}:${CUR_TAG}-${arch}"
              echo "${repo}" >> "$GITHUB_WORKSPACE/_repos.txt"
            done

            rm -rf harbor
          done

          sort -u "$GITHUB_WORKSPACE/_repos.txt" -o "$GITHUB_WORKSPACE/_repos.txt"
          docker logout

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Create multi-arch manifests (Docker Hub)
        env:
          CUR_TAG: ${{ env.CUR_TAG }}
        run: |
          set -euo pipefail
          docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" -p "${{ secrets.DOCKER_HUB_PASSWORD }}"
          while IFS= read -r repo; do
            echo "Creating manifest ${repo}:${CUR_TAG}"
            docker buildx imagetools create \
              -t "${repo}:${CUR_TAG}" \
              "${repo}:${CUR_TAG}-amd64" \
              "${repo}:${CUR_TAG}-arm64"
          done < "$GITHUB_WORKSPACE/_repos.txt"
          docker logout

      - name: GA Release (re-attach installers to publish tag if needed)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CUR_TAG }}
          body: "Automated publish from fork validation"
          files: |
            ${{ env.ASSETS_DIR }}/harbor-offline-installer-*-amd64.tgz
            ${{ env.ASSETS_DIR }}/harbor-offline-installer-*-arm64.tgz
            ${{ env.ASSETS_DIR }}/harbor-online-installer-*-amd64.tgz
            ${{ env.ASSETS_DIR }}/harbor-online-installer-*-arm64.tgz
            ${{ env.ASSETS_DIR }}/md5sum
