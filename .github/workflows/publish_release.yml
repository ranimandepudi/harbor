name: Publish Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to pull assets from"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # (OPTIONAL) remove this entire step if you don't need BUILD_NO/PRE_TAG from upstream
      # - name: Setup env (remove or point to your repo)
      #   run: echo "PRERELEASE=false" >> $GITHUB_ENV

      - name: Select tag
        run: |
          RAW="${{ github.event.inputs.release_tag || github.ref_name }}"
          # trim leading/trailing whitespace
          TAG="$(printf '%s' "$RAW" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          # derive a base tag used inside filenames (your files use v2.14.0-test)
          BASE_TAG="$(printf '%s' "$TAG" | sed -E 's/(-arm64-online|-online|-rc[0-9]+)?$//')"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "BASE_TAG=$BASE_TAG" >> $GITHUB_ENV
          echo "Using TAG=$TAG  BASE_TAG=$BASE_TAG"
      
      - name: Prepare Assets (amd64 + arm64) — robust download
        env:
          REPO: ${{ github.repository }}
          TAG:  ${{ env.TAG }}
          BASE: ${{ env.BASE_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets_path="$PWD/assets"
          mkdir -p "$assets_path"
          echo "Using release tag: $TAG  (filenames use base: $BASE)"

          # Try to list assets; if it fails, rel_json will be empty and we’ll use fallbacks.
          rel_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" || true)"

          pick_name() {
            # $1 = kind (offline|online), $2 = arch (amd64|arm64)
            kind="$1"; arch="$2"
            # Prefer API: find a name that matches ^harbor-(off|on)line-installer-.*-<arch>.tgz
            if [ -n "$rel_json" ]; then
              n="$(echo "$rel_json" | jq -r --arg kind "$kind" --arg arch "$arch" \
                  '.assets[]? | select(.name|test("^harbor-" + $kind + "-installer-.*-" + $arch + "\\.tgz$")) | .name' | head -n1)"
              if [ -n "$n" ] && [ "$n" != "null" ]; then
                echo "$n"; return 0
              fi
            fi
            # Fallback to the constructed filename using BASE tag embedded in your files
            echo "harbor-${kind}-installer-${BASE}-${arch}.tgz"
          }

          download() {
            name="$1"
            # Try API-provided browser_download_url first (if we have rel_json)
            if [ -n "$rel_json" ]; then
              api_url="$(echo "$rel_json" | jq -r --arg name "$name" '.assets[]? | select(.name==$name) | .browser_download_url')"
            else
              api_url=""
            fi

            if [ -n "$api_url" ] && [ "$api_url" != "null" ]; then
              echo "→ downloading via API url: $name"
              curl -fL -H "Authorization: Bearer ${GH_TOKEN}" "$api_url" -o "${assets_path}/${name}" && return 0
            fi

            # Direct URL fallback
            fallback_url="https://github.com/${REPO}/releases/download/${TAG}/${name}"
            echo "→ API url not found; trying direct URL: $fallback_url"
            curl -fL -H "Authorization: Bearer ${GH_TOKEN}" "$fallback_url" -o "${assets_path}/${name}"
          }

          # Resolve names and download all four installers
          OFF_AMD64="$(pick_name offline amd64)";  download "$OFF_AMD64"
          OFF_ARM64="$(pick_name offline arm64)";  download "$OFF_ARM64"
          ON_AMD64="$(pick_name online  amd64)";  download "$ON_AMD64"
          ON_ARM64="$(pick_name online  arm64)";  download "$ON_ARM64"

          # generate md5 list (optional but nice)
          (cd "${assets_path}" && md5sum *.tgz | tee md5sum)

          # Export paths with the actual names we resolved
          echo "ASSETS_DIR=${assets_path}" >> $GITHUB_ENV
          echo "OFFLINE_PACKAGE_PATH=${assets_path}/${OFF_AMD64}" >> $GITHUB_ENV
          echo "ONLINE_PACKAGE_PATH=${assets_path}/${ON_AMD64}"   >> $GITHUB_ENV
          echo "CUR_TAG=${TAG}"  >> $GITHUB_ENV
          echo "PRERELEASE=false" >> $GITHUB_ENV
      
      - name: Prepare Assets (amd64 + arm64) — from Release (API + direct URL fallback)
        env:
          REPO: ${{ github.repository }}
          TAG:  ${{ env.TAG }}             
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets_path="$PWD/assets"
          mkdir -p "$assets_path"

          echo "Using release tag: ${TAG}"

          # Try to list assets via API (nice for private repos), but don't die if it fails.
          rel_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" || true)"

          download() {
            name="$1"
            # 1) Try to find browser_download_url in API JSON
            api_url="$(echo "$rel_json" | jq -r ".assets[]? | select(.name==\"${name}\") | .browser_download_url" 2>/dev/null || true)"
            if [ -n "${api_url}" ] && [ "${api_url}" != "null" ]; then
              echo "→ downloading via API url: ${name}"
              curl -fL -H "Authorization: Bearer ${GH_TOKEN}" "$api_url" -o "${assets_path}/${name}" && return 0
            fi
            # 2) Fallback to direct “releases/download/<tag>/<name>” URL
            fallback_url="https://github.com/${REPO}/releases/download/${TAG}/${name}"
            echo "→ API url not found; trying direct URL: ${fallback_url}"
            curl -fL -H "Authorization: Bearer ${GH_TOKEN}" "$fallback_url" -o "${assets_path}/${name}"
          }

          # Required files (exactly the names you’re using)
          download "harbor-offline-installer-${TAG}-amd64.tgz"
          download "harbor-offline-installer-${TAG}-arm64.tgz"
          download "harbor-online-installer-${TAG}-amd64.tgz"
          download "harbor-online-installer-${TAG}-arm64.tgz"

          # Optional checksums if you uploaded them (no-fail if missing)
          for f in \
            "harbor-offline-installer-${TAG}-amd64.tgz.sha256" \
            "harbor-offline-installer-${TAG}-arm64.tgz.sha256" \
            "harbor-online-installer-${TAG}-amd64.tgz.sha256" \
            "harbor-online-installer-${TAG}-arm64.tgz.sha256"
          do
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://github.com/${REPO}/releases/download/${TAG}/${f}" \
              -o "${assets_path}/${f}" || true
          done

          (cd "${assets_path}" && md5sum *.tgz | tee md5sum)

          echo "ASSETS_DIR=${assets_path}" >> $GITHUB_ENV
          echo "OFFLINE_PACKAGE_PATH=${assets_path}/harbor-offline-installer-${TAG}-amd64.tgz" >> $GITHUB_ENV
          echo "ONLINE_PACKAGE_PATH=${assets_path}/harbor-online-installer-${TAG}-amd64.tgz"   >> $GITHUB_ENV
          echo "MD5SUM_PATH=${assets_path}/md5sum" >> $GITHUB_ENV
          echo "CUR_TAG=${TAG}"  >> $GITHUB_ENV
          echo "PRERELEASE=false" >> $GITHUB_ENV

      - name: Setup Docker
        uses: docker-practice/actions-setup-docker@master
        with:
          docker_version: 20.10
          docker_channel: stable

      - name: Publish Images (amd64 + arm64)
        env:
          CUR_TAG: ${{ env.CUR_TAG }}
        run: |
          set -euo pipefail
          docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" -p "${{ secrets.DOCKER_HUB_PASSWORD }}"
          : > "$GITHUB_WORKSPACE/_images_all.txt"
          for arch in amd64 arm64; do
            pkg="$PWD/assets/harbor-offline-installer-${CUR_TAG}-${arch}.tgz"
            echo "Processing $pkg"
            tar -zxf "$pkg"
            docker load -i ./harbor/harbor.*.tar.gz

            # collect your images
            mapfile -t imgs < <(docker images --format "{{.Repository}}:{{.Tag}}" | grep "^ranichowdary/.\\+:${CUR_TAG}$" || true)

            # retag and push arch-suffixed tags
            for it in "${imgs[@]}"; do
              repo="${it%:*}"
              docker tag "${it}" "${repo}:${CUR_TAG}-${arch}"
              docker push "${repo}:${CUR_TAG}-${arch}"
              echo "${repo}" >> "$GITHUB_WORKSPACE/_images_all.txt"
            done

            rm -rf harbor
          done
          docker logout          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Create multi-arch manifests (Docker Hub)
        run: |
          set -euo pipefail
          cur=${{ env.CUR_TAG }}
          mapfile -t repos < <(sort -u "$GITHUB_WORKSPACE/_images_all.txt")
          echo "Repos to manifest: ${#repos[@]}"
          docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" -p "${{ secrets.DOCKER_HUB_PASSWORD }}"
          for repo in "${repos[@]}"; do
            echo "Creating manifest ${repo}:${cur}"
            docker buildx imagetools create \
              -t ${repo}:${cur} \
              ${repo}:${cur}-amd64 \
              ${repo}:${cur}-arm64
          done
          docker logout

      - name: GA Release
        uses: softprops/action-gh-release@v2
        with:
          body: "Automated publish from fork validation"
          files: |
            ${{ env.ASSETS_DIR }}/harbor-offline-installer-*-amd64.tgz
            ${{ env.ASSETS_DIR }}/harbor-offline-installer-*-arm64.tgz
            ${{ env.ASSETS_DIR }}/harbor-online-installer-*-amd64.tgz
            ${{ env.ASSETS_DIR }}/harbor-online-installer-*-arm64.tgz
            ${{ env.ASSETS_DIR }}/md5sum
