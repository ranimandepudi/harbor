name: Publish Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish images/manifests as this tag (default: ref tag)"
        required: false
        type: string
      assets_tag:
        description: "Tag of the release that already contains the installer assets"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Select tags
        run: |
          PUBLISH_TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          ASSETS_TAG="${{ github.event.inputs.assets_tag }}"
          PUBLISH_TAG="$(echo -n "$PUBLISH_TAG" | xargs)"
          ASSETS_TAG="$(echo -n "$ASSETS_TAG" | xargs)"
          echo "CUR_TAG=$PUBLISH_TAG"  >> $GITHUB_ENV
          echo "ASSETS_TAG=$ASSETS_TAG" >> $GITHUB_ENV

      
      - name: Prepare Assets (amd64 + arm64) — from GitHub Release
        env:
          REPO: ${{ github.repository }}
          ASSETS_TAG: ${{ env.ASSETS_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets_path="$PWD/assets"
          mkdir -p "$assets_path"

          rel_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/tags/${ASSETS_TAG}")"

          echo "Assets on ${ASSETS_TAG}:"
          echo "$rel_json" | jq -r '(.assets // [])[].name' | sed 's/^/  - /'

          # Find the four .tgz assets by pattern (base tag inferred from filenames)
          for typ in offline online; do
            for arch in amd64 arm64; do
              name="$(echo "$rel_json" \
                | jq -r --arg typ "$typ" --arg arch "$arch" '
                    (.assets // [])[].name
                    | select(test("^harbor-" + $typ + "-installer-.*-" + $arch + "\\.tgz$"))
                  ' \
                | head -n1)"
              if [ -z "$name" ]; then
                echo "Missing required asset on '${ASSETS_TAG}': harbor-${typ}-installer-<BASE>-${arch}.tgz"
                exit 1
              fi
              url="$(echo "$rel_json" | jq -r --arg n "$name" '
                      (.assets // [])[] | select(.name==$n) | .browser_download_url')"
              echo "↓ $name"
              curl -fsSL "$url" -o "${assets_path}/${name}"
            done
          done

          # Optional checksums
          for f in "${assets_path}"/*.tgz; do
            sha="$f.sha256"
            name="$(basename "$f")"
            sha_name="$(basename "$sha")"
            url_sha="$(echo "$rel_json" | jq -r --arg n "$sha_name" '
                        (.assets // [])[] | select(.name==$n) | .browser_download_url')"
            if [ -n "${url_sha}" ] && [ "${url_sha}" != "null" ]; then
              echo "↓ $sha_name"
              curl -fsSL "$url_sha" -o "$sha"
            else
              echo "Note: checksum for $name not present (ok)"
            fi
          done

          (cd "${assets_path}" && md5sum *.tgz | tee md5sum)

          # Export paths for later steps
          echo "ASSETS_DIR=${assets_path}" >> $GITHUB_ENV
          # Pick any of the downloaded names for these two back-compat vars:
          amd64_off="$(ls -1 ${assets_path}/harbor-offline-installer-*-amd64.tgz | head -n1)"
          amd64_onl="$(ls -1 ${assets_path}/harbor-online-installer-*-amd64.tgz  | head -n1)"
          echo "OFFLINE_PACKAGE_PATH=${amd64_off}" >> $GITHUB_ENV
          echo "ONLINE_PACKAGE_PATH=${amd64_onl}" >> $GITHUB_ENV
          echo "MD5SUM_PATH=${assets_path}/md5sum" >> $GITHUB_ENV
      - name: Setup Docker
        uses: docker-practice/actions-setup-docker@master
        with:
          docker_version: 20.10
          docker_channel: stable

      
      - name: Publish Images (amd64 + arm64)
        env:
          CUR_TAG: ${{ env.CUR_TAG }}
          OFFLINE_AMD64: ${{ env.OFFLINE_AMD64 }}
          OFFLINE_ARM64: ${{ env.OFFLINE_ARM64 }}
        run: |
          set -euo pipefail
          docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" -p "${{ secrets.DOCKER_HUB_PASSWORD }}"
          : > "$GITHUB_WORKSPACE/_repos.txt"

          for arch in amd64 arm64; do
            pkg_var="OFFLINE_${arch^^}"
            pkg="${!pkg_var}"
            echo "Processing offline bundle: ${pkg}"
            tar -zxf "$pkg"

            # find inner tar (name varies: harbor.*.tar.gz)
            inner_tar="$(ls -1 harbor/harbor*.tar.gz | head -n1 || true)"
            if [ -z "${inner_tar}" ]; then
              echo "ERROR: No harbor*.tar.gz inside $(basename "$pkg"). Did you upload ONLINE instead of OFFLINE?"
              exit 1
            fi
            docker load -i "$inner_tar"

            # collect your repos tagged with CUR_TAG (ranichowdary/*:v2.14.0-test)
            mapfile -t imgs < <(docker images --format '{{.Repository}}:{{.Tag}}' \
              | grep "^ranichowdary/.\\+:${CUR_TAG}$" || true)

            # retag with -arch suffix and push
            for it in "${imgs[@]}"; do
              repo="${it%:*}"
              docker tag  "${it}" "${repo}:${CUR_TAG}-${arch}"
              docker push "${repo}:${CUR_TAG}-${arch}"
              echo "${repo}" >> "$GITHUB_WORKSPACE/_repos.txt"
            done

            rm -rf harbor
          done

          sort -u "$GITHUB_WORKSPACE/_repos.txt" -o "$GITHUB_WORKSPACE/_repos.txt"
          docker logout
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Create multi-arch manifests (Docker Hub)
        env:
          CUR_TAG: ${{ env.CUR_TAG }}
        run: |
          set -euo pipefail
          docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" -p "${{ secrets.DOCKER_HUB_PASSWORD }}"
          while IFS= read -r repo; do
            echo "Creating manifest ${repo}:${CUR_TAG}"
            docker buildx imagetools create \
              -t "${repo}:${CUR_TAG}" \
              "${repo}:${CUR_TAG}-amd64" \
              "${repo}:${CUR_TAG}-arm64"
          done < "$GITHUB_WORKSPACE/_repos.txt"
          docker logout

      
      - name: GA Release (re-attach installers to publish tag if needed)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CUR_TAG }}
          body: "Automated publish from fork validation"
          files: |
            ${{ env.ASSETS_DIR }}/harbor-offline-installer-*-amd64.tgz
            ${{ env.ASSETS_DIR }}/harbor-offline-installer-*-arm64.tgz
            ${{ env.ASSETS_DIR }}/harbor-online-installer-*-amd64.tgz
            ${{ env.ASSETS_DIR }}/harbor-online-installer-*-arm64.tgz
            ${{ env.ASSETS_DIR }}/md5sum
